# dsp-io/Cargo.toml
#
# IO layer — Zarr v3 storage, pyramid building, viewport serving.

[package]
name    = "dsp-io"
version = "0.1.0"
edition = "2024"

[dependencies]
dsp-core         = { path = "../dsp-core" }
zarrs            = { workspace = true }
zarrs_filesystem = { workspace = true }
serde            = { workspace = true, features = ["derive"] }
serde_json       = { workspace = true }
rayon            = { workspace = true }
anyhow           = { workspace = true }
memmap2          = { workspace = true }
mmap-sync        = { workspace = true }
tonic            = { workspace = true, features = ["server", "transport", "zstd"] }
tonic-prost      = "0.14"
prost            = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream     = { version = "0.1", features = ["net"] }
ureq             = { workspace = true }
log              = { workspace = true }
env_logger       = { workspace = true }
uuid             = { workspace = true }
once_cell        = "1.20"
parking_lot      = "0.12"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
dsp-core = { path = "../dsp-core" }
